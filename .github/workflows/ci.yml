name: CI

# Lint/typecheck/test on every PR (SRS §8.1). No service containers — the
# existing suite runs entirely against in-memory SQLite (tests/conftest.py),
# and Docker is prohibited in CI same as dev/prod (ADR-0002, SRS C-1).
#
# `master` is listed alongside `main` because this repository's default branch
# is master: with `[main]` alone the push trigger matched nothing, so direct
# pushes to the default branch ran no checks at all. Keep both names here
# unless the default branch is renamed.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

# Neuraforge reverse proxy (SRS §10.2/§10.7, ARCHITECTURE.md process topology).
# Install as /etc/nginx/sites-available/neuraforge.conf, symlink into
# sites-enabled (scripts/provision.sh does both).
#
# Ships HTTP-only on purpose: `certbot --nginx -d your-domain.example` is the
# standard way to add the 443/TLS server block (it rewrites this file in
# place once a real certificate exists) — shipping a hardcoded HTTPS block
# pointing at certs that don't exist yet would fail `nginx -t` on every fresh
# server, before certbot ever runs. Re-add the security headers below to the
# certbot-generated 443 block once it exists (certbot does not carry them
# over automatically).
#
# Security headers here are a network-level baseline (HSTS — meaningful only
# once TLS is live — sniff/frame protection, a same-origin-only CSP). SRS
# §6.1 calls for a *nonce*-based CSP for inline scripts; that needs a
# Next.js middleware generating a per-request nonce, which does not exist in
# this codebase yet (deploy-what's-built scope decision) — tracked as
# follow-up, not silently built into this config.

upstream neuraforge_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream neuraforge_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://neuraforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://neuraforge_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev-mode HMR websocket; harmless no-op once built for prod.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

[project]
name = "neuraforge-api"
version = "0.1.0"
description = "Neuraforge API — FastAPI modular monolith (ADR-0001)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.20",          # dev database driver
    "asyncpg>=0.30",            # production database driver
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=43.0",
    "email-validator>=2.2",
    "httpx>=0.27",
    "numpy>=2.1",  # exercise runtime dependency (FR-RUN-2); torch-CPU deferred, too heavy for dev seed content
    "gunicorn>=23.0",  # production process manager (SRS §10.2: Gunicorn + UvicornWorker)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

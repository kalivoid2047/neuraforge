[project]
name = "neuraforge-api"
version = "0.1.0"
description = "Neuraforge API — FastAPI modular monolith (ADR-0001)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.20",          # dev database driver
    "asyncpg>=0.30",            # production database driver
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=43.0",
    "email-validator>=2.2",
    "httpx>=0.27",
    "numpy>=2.1",  # exercise runtime dependency (FR-RUN-2); torch-CPU deferred, too heavy for dev seed content
    "gunicorn>=23.0",  # production process manager (SRS §10.2: Gunicorn + UvicornWorker)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly rather than inheriting ruff's defaults. ruff 0.16.0 expanded
# its default rule set (adding I, ISC, PLW, PYI, RUF and SIM), which turned a
# routine patch-level bump into 13 errors on code that had not changed. With an
# explicit select, lint results are a function of THIS FILE rather than of
# whichever ruff version happens to be installed -- the same reproducibility
# argument as `uv sync --frozen` and `npm ci` in .github/workflows/ci.yml.
#
# The set below is exactly what 0.16.0 enables by default, adopted deliberately.
select = ["E4", "E7", "E9", "F", "I", "ISC", "PLW", "PYI", "RUF", "SIM"]

ignore = [
    # This is a teaching codebase: en dashes in prose docstrings and "×" in
    # "d_model×d_k" are correct typography, not typos. RUF001/RUF002 would have
    # us replace a MULTIPLICATION SIGN with the letter x, which is wrong.
    "RUF001",
    "RUF002",
    # Two deliberate module-level singletons: the UUIDv7 monotonic counter in
    # core/ids.py (sequence must persist between calls) and the lazily loaded
    # Ed25519 signing key in auth/security.py. Both are memoization, not
    # incidental mutable state, and rewriting them buys nothing.
    "PLW0603",
]
